[package]
name = "hermes-app"
version = "0.1.0"
description = "Hermes — end-to-end encrypted group chat"
edition = "2024"

[lib]
# The suffix avoids a name clash with the bin target on Windows (see tauri docs).
name = "hermes_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
hermes-core = { path = "../../crates/hermes-core" }
serde_json = "1.0.154"
tauri = "2.12.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde"] }

[build-dependencies]
tauri-build = "2.7.4"
