[package]
name = "hermes-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
bs58 = "0.5.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "zbus-secret-service-keyring-store", "windows-native-keyring-store"] }
openmls = "0.9.2"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tls_codec = "0.5.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"
